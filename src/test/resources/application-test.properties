# ------------------------------------------------------------------
# Test profile: in-memory H2 in MySQL compatibility mode.
# The real application keeps using MySQL through application.properties.
# ------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:smart_parking_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Keep the background expiry job out of the tests. Tests call the service
# method directly so the assertions stay deterministic.
parking.reservation.expiry-scan-ms=3600000
parking.reservation.expiry-initial-delay-ms=3600000

logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.web=warn
