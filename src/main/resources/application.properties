# ------------------------------------------------------------------
# Smart Parking Allocation System - main configuration
# ------------------------------------------------------------------
spring.application.name=smart-parking-system
server.port=8080

# MySQL connection. Change username/password for your machine.
spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# Hibernate creates/updates tables automatically for the demo.
# For a strict production setup, run database/schema.sql and set this to none.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Reservation rules
parking.reservation.grace-minutes=15
parking.reservation.expiry-scan-ms=30000
parking.reservation.expiry-initial-delay-ms=15000
parking.reservation.max-duration-hours=24
parking.reservation.max-advance-days=30
parking.reservation.past-grace-minutes=5

# Quieter logs during the demo
logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.web=info
